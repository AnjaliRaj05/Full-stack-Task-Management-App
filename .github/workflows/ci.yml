name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Lint & Build Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prettier --check .
      - run: npm run lint
        continue-on-error: true   # TODO: remove once warnings are fixed (Phase 0 cleanup)
      # - run: npm test       # enable after adding tests (Phase 1)

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npx prettier --check src/
      - run: npm run lint
        continue-on-error: true   # TODO: remove once warnings are fixed (Phase 0 cleanup)
      - run: npm run build
